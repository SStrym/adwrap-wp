name: wp-adwrap
recipe: wordpress

env_file:
  - .env.example
  - .lando.env

excludes:
  - vendor
  - node_modules

config:
  php: "8.3"
  via: nginx
  database: mariadb:10.11
  cache: redis
  webroot: web
  xdebug: false

services:
  appserver:
    overrides:
      extra_hosts:
        - "host.docker.internal:host-gateway"
  database:
    type: mariadb:10.11
    portforward: true
  cache:
    type: redis:7
    portforward: true
    overrides:
      # Pass tuning as CLI flags instead of a mounted config file.
      # Single-file bind mounts are unreliable on Windows/Docker Desktop,
      # which caused redis-server to fail with "can't open config file".
      command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --protected-mode no
  pma:
    type: phpmyadmin
    hosts:
      - database

tooling:
  wp:
    service: appserver
  composer:
    service: appserver
  mysql:
    service: database
  redis-cli:
    service: cache
